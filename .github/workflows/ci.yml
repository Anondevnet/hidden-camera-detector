name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint & type-check
        run: |
          ruff check src tests
          ruff format --check src tests
          mypy
      - name: Unit tests (offline, mocked network, synthetic images)
        run: pytest

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: android/gradle/wrapper/gradle-wrapper.properties
      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/licenses"
          # Standard Android SDK license hashes used by official cmdline-tools.
          printf '%s\n' 24333f8a63b6825ea9c5514f21c17daf315c47af > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '%s\n' 84831b9409646161a1645d4434687ad2923b2c2 > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          ./gradlew :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
