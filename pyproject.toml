[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hidden-camera-detector"
version = "0.1.0"
description = "Find likely security cameras on a LAN, over Bluetooth, and via lens-glint or IR-dot cues in a camera feed. Built as a library, CLI, phone-friendly web UI, and Android app."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anondevnet" }]
keywords = ["camera", "privacy", "onvif", "rtsp", "bluetooth", "opencv", "fastapi"]
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "zeroconf>=0.132",
]

[project.optional-dependencies]
ble = ["bleak>=0.22"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
]
all = ["hidden-camera-detector[ble]"]

[project.scripts]
hcd = "hcd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hcd"]

[tool.hatch.build.targets.wheel.force-include]
"src/hcd/data" = "hcd/data"
"src/hcd/web" = "hcd/web"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q -m 'not live'"
markers = ["live: touches real network, radio, or camera devices (deselected by default in CI)"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/hcd/api.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
packages = ["hcd"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
